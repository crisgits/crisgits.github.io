<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chato Admin Panel | SAKIL AGENCY</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #110408;
      --panel-bg: rgba(36, 12, 20, 0.86);
      --border: rgba(251, 113, 133, 0.35);
      --accent: #fb7185;
      --accent-crimson: #e11d48;
      --gold: #fbbf24;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 20% 10%, rgba(225, 29, 72, 0.25), transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(244, 63, 94, 0.2), transparent 45%);
      color: var(--text);
      min-height: 100vh;
    }

    /* Top Header with Left 3-Line Menu Button */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(17, 4, 8, 0.92);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border);
      padding: 13px 16px;
    }

    .nav-inner {
      max-width: 1050px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .menu-toggle {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: rgba(251, 113, 133, 0.16);
      border: 1px solid rgba(251, 113, 133, 0.42);
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .menu-toggle:hover { background: rgba(251, 113, 133, 0.28); }

    .menu-toggle span {
      display: block;
      width: 20px;
      height: 2.2px;
      background: #fff;
      border-radius: 2px;
    }

    .nav-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #fbbf24, #d97706);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: #110408;
    }

    .brand-text {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 0.5px;
    }

    /* Left Slide-out Sidebar */
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 3, 10, 0.75);
      backdrop-filter: blur(6px);
      z-index: 90;
      display: none;
    }

    .sidebar {
      position: fixed;
      top: 0;
      left: -290px;
      width: 275px;
      height: 100vh;
      background: #18060c;
      border-right: 1px solid rgba(251, 113, 133, 0.32);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: left 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      box-shadow: 12px 0 40px rgba(0, 0, 0, 0.7);
    }

    .sidebar.open { left: 0; }

    .sidebar-header {
      padding: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 14px;
      color: var(--gold);
      letter-spacing: 0.6px;
    }

    .sidebar-close {
      background: rgba(255, 255, 255, 0.06);
      border: none;
      color: #cbd5e1;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 18px;
      cursor: pointer;
    }

    .sidebar-menu {
      flex-grow: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .menu-label {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: #64748b;
      padding: 8px 10px 4px;
    }

    .side-link {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: #cbd5e1;
      font-size: 13.5px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .side-link:hover {
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
    }

    .side-link.active {
      background: linear-gradient(90deg, rgba(225, 29, 72, 0.38), rgba(244, 63, 94, 0.28));
      border-color: rgba(253, 164, 175, 0.52);
      color: #fff;
    }

    .side-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .sidebar-footer {
      padding: 14px 12px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-sidebar-logout {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      background: rgba(220, 38, 38, 0.18);
      border: 1px solid rgba(239, 68, 68, 0.45);
      color: #fca5a5;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }

    .btn-sidebar-logout:hover {
      background: rgba(220, 38, 38, 0.3);
      color: #fff;
    }

    /* Main Container */
    .container { max-width: 740px; margin: 0 auto; padding: 26px 16px 65px; }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 24px;
      margin-bottom: 24px;
      backdrop-filter: blur(16px);
      box-shadow: 0 14px 38px rgba(0, 0, 0, 0.48);
    }

    .brand-top { text-align: center; margin-bottom: 20px; }

    .agency-pill {
      display: inline-block;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.45);
      color: var(--gold);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.8px;
      padding: 4px 12px;
      border-radius: 50px;
      margin-bottom: 8px;
    }

    h2 { font-size: 21px; font-weight: 800; color: #fff; }
    h3 { font-size: 17px; font-weight: 700; color: #fff; }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    @media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }

    .full-width { grid-column: 1 / -1; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: rgba(20, 7, 12, 0.88);
      border: 1px solid rgba(251, 113, 133, 0.38);
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      color-scheme: dark;
    }

    input:focus, select:focus { border-color: #fda4af; }
    input[readonly] { background: rgba(44, 14, 24, 0.55); color: #38bdf8; font-weight: 700; }
    #bdtAmount[readonly] { color: var(--gold); }

    .date-range-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .period-preview {
      font-size: 12px;
      color: #fecdd3;
      margin-top: 5px;
      font-weight: 600;
    }

    .rate-bar {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      background: rgba(225, 29, 72, 0.14);
      border: 1px dashed rgba(251, 113, 133, 0.45);
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }

    .btn-primary {
      background: linear-gradient(90deg, #f43f5e, #e11d48);
      color: #fff;
      box-shadow: 0 6px 20px rgba(225, 29, 72, 0.35);
    }

    .btn-primary:hover { opacity: 0.92; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-cancel { background: #334155; color: #fff; display: none; }

    .preview-box { display: flex; align-items: center; gap: 14px; margin-top: 6px; }
    #previewImg {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #fb7185;
      display: none;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .list-item:last-child { border-bottom: none; }
    .item-left { display: flex; align-items: center; gap: 12px; }
    .mini-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #fb7185;
    }
    .item-title { font-size: 15px; font-weight: 700; color: #fff; }
    .item-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .action-btns { display: flex; gap: 6px; }
    .btn-sm {
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
    }
    .btn-edit { background: #059669; }
    .btn-del { background: #dc2626; }
  </style>
</head>

  <!-- Admin Dashboard (Protected by Firebase Auth) -->
  <div class="container" id="adminDashboard" style="display: none;">
    <div class="panel">

        <div class="agency-pill">SAKIL AGENCY &bull; CHATO</div>
        <h2 id="formHeading">Add Chato Host Weekly Salary</h2>
      </div>

      <div class="rate-bar">
        <div>
          <label>Coins per $1 USD</label>
          <input type="number" id="coinsPerUsd" value="8000" oninput="calculateSalary()">
        </div>
        <div>

            <option value="Paid">Paid</option>

        <div class="full-width">
          <label>Week Period (Select Start Date to End Date) *</label>
          <div class="date-range-box">
            <input type="date" id="startDate" onchange="updatePeriodPreview()">

          </div>

    <!-- Existing Records List -->
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px;">

        <input type="text" id="adminSearch" placeholder="Filter by ID or Name..." style="max-width:220px; padding:8px 12px;" oninput="renderAdminList()">

  <script>
    function openSidebar() {
      document.getElementById('sidebar').classList.add('open');
      document.getElementById('sidebarOverlay').style.display = 'block';
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').style.display = 'none';
    }

    function formatDisplayDate(dateStr) {
      if (!dateStr) return "";
      const [y, m, d] = dateStr.split("-");
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `${d} ${months[parseInt(m, 10) - 1]} ${y}`;
    }

    function getFormattedWeekPeriod() {
      const start = document.getElementById('startDate').value;
      const end = document.getElementById('endDate').value;
      return (start && end) ? `${formatDisplayDate(start)} - ${formatDisplayDate(end)}` : "";
    }

    function updatePeriodPreview() {
      const period = getFormattedWeekPeriod();
      document.getElementById('periodPreview').textContent = period 
        ? `Selected Period: ${period}` 
        : "Selected Period: Please pick both Start and End dates";
    }

    function calculateSalary() {
      const coins = parseFloat(document.getElementById('totalCoins').value) || 0;
      const coinRate = parseFloat(document.getElementById('coinsPerUsd').value) || 8000;
      const bdtRate = parseFloat(document.getElementById('bdtPerUsd').value) || 110;
      const usd = coins / coinRate;
      const bdt = usd * bdtRate;
      document.getElementById('usdAmount').value = usd.toFixed(2);
      document.getElementById('bdtAmount').value = bdt.toFixed(2);
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = document.getElementById('previewImg');
        img.src = e.target.result;
        img.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpAuWT_J0XfFQm_qbMLi6apfgHr3Fu5ik",
      authDomain: "kamo-salary-sheet.firebaseapp.com",
      projectId: "kamo-salary-sheet",
      storageBucket: "kamo-salary-sheet.firebasestorage.app",
      messagingSenderId: "523404807417",
      appId: "1:523404807417:web:db3762935ab2cc2bbda628"
    };

    const APP_CATEGORY = "Chato";
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let recordsCache = [];

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "admin.html";
      } else {
        document.getElementById('adminDashboard').style.display = 'block';
      }
    });

    window.logoutAdmin = async function() {
      await signOut(auth);
      window.location.href = "admin.html";
    };

    function compressPhoto(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 220;
            let w = img.width, h = img.height;
            if (w > h) { if (w > maxDim) { h *= maxDim / w; w = maxDim; } }
            else { if (h > maxDim) { w *= maxDim / h; h = maxDim; } }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
        };
      });
    }

    window.saveHostRecord = async function() {
      const hostId = document.getElementById('hostId').value.trim();
      const name = document.getElementById('hostName').value.trim();
      const phone = document.getElementById('hostPhone').value.trim();
      const startDate = document.getElementById('startDate').value;
      const endDate = document.getElementById('endDate').value;
      const week = getFormattedWeekPeriod();
      const coins = parseFloat(document.getElementById('totalCoins').value) || 0;
      const usd = parseFloat(document.getElementById('usdAmount').value) || 0;
      const bdt = parseFloat(document.getElementById('bdtAmount').value) || 0;
      const status = document.getElementById('payStatus').value;

      if (!hostId || !name || !week) {
        alert("Please fill in Host ID, Host Name, and select both Start & End dates.");
        return;
      }

      const btn = document.getElementById('saveBtn');
      btn.textContent = "Saving...";
      btn.disabled = true;

      const docId = document.getElementById('docId').value;
      const fileInput = document.getElementById('photoInput');
      let photoData = document.getElementById('existingPhoto').value;

      try {
        if (fileInput.files.length > 0) {
          photoData = await compressPhoto(fileInput.files[0]);
        }

        const payload = { app: APP_CATEGORY, hostId, name, phone, startDate, endDate, week, coins, usd, bdt, status, photo: photoData };

        if (docId) {
          await updateDoc(doc(db, "hosts", docId), payload);
          alert("Chato host record updated!");
        } else {
          await addDoc(collection(db, "hosts"), payload);
          alert("New Chato host record added!");
        }
        window.resetForm();
      } catch (err) {
        alert("Error: " + err.message);
      }

      btn.textContent = "Save Chato Record";
      btn.disabled = false;
    };

    window.editRecord = function(id) {
      const item = recordsCache.find(r => r.id === id);
      if (!item) return;

      document.getElementById('formHeading').textContent = "Update Chato Host Salary";
      document.getElementById('docId').value = item.id;
      document.getElementById('hostId').value = item.hostId || '';
      document.getElementById('hostName').value = item.name || '';
      document.getElementById('hostPhone').value = item.phone || '';
      document.getElementById('startDate').value = item.startDate || '';
      document.getElementById('endDate').value = item.endDate || '';
      updatePeriodPreview();
      if (!item.startDate && item.week) {
        document.getElementById('periodPreview').textContent = `Current Period: ${item.week}`;
      }
      document.getElementById('totalCoins').value = item.coins || 0;
      document.getElementById('usdAmount').value = Number(item.usd || 0).toFixed(2);
      document.getElementById('bdtAmount').value = Number(item.bdt || 0).toFixed(2);
      document.getElementById('payStatus').value = item.status || 'Pending';
      document.getElementById('existingPhoto').value = item.photo || '';
      document.getElementById('cancelBtn').style.display = 'block';

      const img = document.getElementById('previewImg');
      if (item.photo) { img.src = item.photo; img.style.display = 'block'; }
      else { img.style.display = 'none'; }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.deleteRecord = async function(id) {
      if (confirm("Are you sure you want to delete this Chato record?")) {
        await deleteDoc(doc(db, "hosts", id));
      }
    };

    window.resetForm = function() {
      document.getElementById('formHeading').textContent = "Add Chato Host Weekly Salary";
      document.getElementById('docId').value = '';
      document.getElementById('hostId').value = '';
      document.getElementById('hostName').value = '';
      document.getElementById('hostPhone').value = '';
      document.getElementById('startDate').value = '';
      document.getElementById('endDate').value = '';
      document.getElementById('periodPreview').textContent = 'Selected Period: Not selected';
      document.getElementById('totalCoins').value = '';
      document.getElementById('usdAmount').value = '0.00';
      document.getElementById('bdtAmount').value = '0.00';
      document.getElementById('payStatus').value = 'Pending';
      document.getElementById('photoInput').value = '';
      document.getElementById('existingPhoto').value = '';
      document.getElementById('previewImg').style.display = 'none';
      document.getElementById('cancelBtn').style.display = 'none';
    };

    window.renderAdminList = function() {
      const q = document.getElementById('adminSearch').value.trim().toLowerCase();
      const container = document.getElementById('adminHostList');
      const filtered = recordsCache.filter(r => 
        !q || (r.hostId && r.hostId.toLowerCase().includes(q)) || (r.name && r.name.toLowerCase().includes(q))
      );

      if (filtered.length === 0) {
        container.innerHTML = `<p style="color:#94a3b8; font-size:13px;">No Chato records found.</p>`;
        return;
      }

      container.innerHTML = filtered.map(h => `
        <div class="list-item">
          <div class="item-left">
            <img src="${h.photo || 'https://via.placeholder.com/48/280c15/ffffff?text=H'}" class="mini-avatar">
            <div>
              <div class="item-title">${h.name} <span style="color:#fecdd3; font-size:12px;">(${h.hostId})</span></div>
              <div class="item-sub">${h.week} &bull; ${Number(h.coins || 0).toLocaleString()} Coins &bull; $${Number(h.usd || 0).toFixed(2)} &bull; <strong style="color:#fbbf24;">&#2547;${Number(h.bdt || 0).toFixed(2)}</strong> [${h.status}]</div>
            </div>
          </div>
          <div class="action-btns">
            <button class="btn-sm btn-edit" onclick="editRecord('${h.id}')">Edit</button>
            <button class="btn-sm btn-del" onclick="deleteRecord('${h.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    };

    onSnapshot(collection(db, "hosts"), (snapshot) => {
      recordsCache = [];
      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        if (data.app && data.app.toLowerCase() === APP_CATEGORY.toLowerCase()) {
          recordsCache.push({ id: docSnap.id, ...data });
        }
      });
      recordsCache.sort((a, b) => (Number(b.coins) || 0) - (Number(a.coins) || 0));
      window.renderAdminList();
    });
  </script>
</body>
</html>
